<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e27">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="portrait">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://qastrod.pl/gra-one-click-goal">
<meta name="description" content="One Click Goal — one button, endless World Cups.">
<title>One Click Goal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{
  --bg:#0a0e27; --panel:#161c3f; --panel2:#212a55; --txt:#e8eaf6;
  --green:#2ecc40; --red:#ff4757; --gold:#ffd700; --accent:#4cc9f0; --pink:#ff477e;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{background:#0a0e27; height:100%;}
body{
  background:linear-gradient(165deg,#0a0e27 0%,#141a45 45%,#1a1140 70%,#0a0e27 100%) fixed;
  color:var(--txt);
  font-family:'Courier New', monospace; font-weight:bold;
  display:flex; justify-content:center; height:100%;
  image-rendering:pixelated; overflow:hidden;
  touch-action:manipulation; overscroll-behavior:none;
}
.pxfont, h1, .btn, #bigmsg, #actionlbl, .logo-top, .logo-goal, .tagline, .chip, .vs, .modebox h2, .qbanner, .langbtn, .chipbtn{
  font-family:'Press Start 2P','Courier New',monospace;
}
#app{width:100%; max-width:640px; padding:8px; position:relative;
  height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));}
#hardband{flex:0 0 auto;}
.scr{display:none; animation:fadein .25s; flex:1; min-height:0;
  scrollbar-width:none;}
.scr::-webkit-scrollbar{display:none; width:0; height:0;}
.scr.on{display:block; overflow-y:auto; overflow-x:hidden;}
#scr-match.on{display:flex; flex-direction:column; overflow:hidden;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
h1{font-size:20px; text-align:center; letter-spacing:1px; margin:14px 0 8px; line-height:1.5;
   text-shadow:3px 3px 0 #000;}
.sub{text-align:center; color:var(--accent); font-size:13px; margin-bottom:14px; letter-spacing:1px;}
.btn{
  display:block; width:100%; padding:16px 12px; margin:12px 0;
  background:linear-gradient(180deg,#2b355f,#1c2348); color:var(--txt); border:3px solid #4a5688;
  font-weight:bold; font-size:12px; letter-spacing:1px; line-height:1.4;
  cursor:pointer; box-shadow:0 5px 0 #0b0f24, 0 8px 18px rgba(0,0,0,.5); text-transform:uppercase;
  border-radius:4px;
}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 #0b0f24;}
.btn.big{font-size:15px; padding:20px; background:linear-gradient(180deg,#34d058,#1f8f3a); border-color:#7dffa0; color:#04220c; text-shadow:none;}
.btn.gold{background:linear-gradient(180deg,#ffd75e,#c99700); border-color:#ffe89a; color:#3a2a00;}
.btn.danger{background:linear-gradient(180deg,#ff5f6d,#b91c2e); border-color:#ff9aa5; color:#2b0005;}
.btn.slim{max-width:420px; margin:8px auto; font-size:10px; padding:12px;}
.panel{background:var(--panel); border:3px solid #000; box-shadow:4px 4px 0 #000; padding:12px; margin:10px 0; border-radius:4px;}
.center{text-align:center;}
.small{font-size:12px; color:#9aa8cc;}
.goldtxt{color:var(--gold);} .greentxt{color:var(--green);} .redtxt{color:var(--red);}
.youtag{color:var(--accent); font-size:10px;}

/* ===== NAV / LANG ===== */
.navrow{display:flex; justify-content:space-between; align-items:center; gap:8px; margin:4px 0 2px; flex-wrap:wrap;}
.langbtn,.chipbtn{
  font-size:9px; padding:8px 10px; cursor:pointer; letter-spacing:1px;
  background:rgba(76,201,240,.1); border:2px solid #3a4570; color:#9aa8cc; border-radius:4px;
}
.langbtn.active{border-color:var(--accent); color:#fff; background:rgba(76,201,240,.25);}
.chipbtn:active{transform:translateY(2px);}
.i-back::before,#mode-menu::before,#match-menu::before,#msg-menu::before,#btn-exit::before{content:'◀';display:inline-block;margin-right:7px;color:#4cc9f0;text-shadow:1px 1px 0 #000;transform:translateY(-1px)}
.i-back:hover::before,#mode-menu:hover::before,#match-menu:hover::before,#msg-menu:hover::before,#btn-exit:hover::before{color:#ffd700;transform:translate(-2px,-1px)}
.langwrap{display:flex; gap:6px; margin-left:auto;}
#scr-title .navrow{position:absolute; top:10px; right:10px; z-index:6; margin:0;}

/* ===== QASTROD BANNER ===== */
.qbanner{
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin:12px auto 4px; max-width:420px;
  background:linear-gradient(180deg,#e62117,#b31217); color:#fff;
  border:2px solid #ff6b60; border-radius:6px; padding:11px 12px;
  font-size:9px; letter-spacing:1px; text-decoration:none; line-height:1.5; text-align:center;
  box-shadow:0 4px 0 #0b0f24;
}
.qbanner:active{transform:translateY(2px); box-shadow:0 2px 0 #0b0f24;}
.qbanner.mini{margin:8px auto 2px; padding:9px 10px; font-size:8px;}

/* ===== TITLE / HERO ===== */
#scr-title{position:relative; border-radius:6px;}
#pixwrap{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1;}
.pix{position:absolute; bottom:-12px; border-radius:1px; animation:pixfloat linear infinite;}
@keyframes pixfloat{from{transform:translateY(0);}to{transform:translateY(-95vh);}}
.hero{position:relative; z-index:2; padding-top:64px;}
.hero>.btn,.hero>.qbanner{width:100%;max-width:420px;margin-left:auto;margin-right:auto;}
.logo-top{
  text-align:center; font-size:17px; letter-spacing:4px; color:var(--accent);
  text-shadow:2px 2px 0 #000; animation:slidein .6s ease-out;
}
@keyframes slidein{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:none;}}
.logo-goal{
  text-align:center; font-size:52px; letter-spacing:2px; margin:6px 0 2px; color:#fff;
  text-shadow:0 4px 0 #b8860b, 0 8px 0 #000, 0 0 34px rgba(255,215,0,.5);
  animation:logopop .7s cubic-bezier(.2,1.6,.4,1);
}
@keyframes logopop{from{opacity:0;transform:scale(.4);}to{opacity:1;transform:scale(1);}}
.logo-goal .ball{display:inline-block; animation:spin 4s linear infinite; font-size:44px;}
@keyframes spin{to{transform:rotate(360deg);}}
.tagline{
  text-align:center; font-size:9px; letter-spacing:2px; color:var(--gold);
  margin:12px auto; max-width:94%; line-height:1.8; text-shadow:1px 1px 0 #000;
}
.chips{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
.chip{
  font-size:8px; padding:7px 10px; letter-spacing:1px; border-radius:20px;
  background:rgba(76,201,240,.12); border:1px solid rgba(76,201,240,.45); color:#bfe9ff;
}
.demo{max-width:420px; margin:0 auto 6px;}
.demo-cap{text-align:center; font-size:11px; color:#9aa8cc; margin-bottom:6px; letter-spacing:1px;}
.demo-bar{position:relative; height:24px; background:#7a1f1f; border:3px solid #fff;
  border-radius:3px; overflow:hidden; box-shadow:0 4px 0 #0b0f24;}
.demo-zone{position:absolute; top:0; bottom:0; left:37%; width:26%; background:var(--green);}
.demo-perf{position:absolute; top:0; bottom:0; left:46.7%; width:6.5%; background:#0a6b1f;}
.demo-needle{position:absolute; top:-2px; bottom:-2px; width:5px; background:#fff; border:1px solid #000;
  animation:sweep 0.9s linear infinite alternate;}
@keyframes sweep{from{left:3%;}to{left:94%;}}
.btn.play{
  max-width:420px; margin:14px auto 10px; font-size:16px; padding:20px; line-height:1.5;
  background:linear-gradient(180deg,#34d058,#1f8f3a); border-color:#7dffa0; color:#04220c; text-shadow:none;
  animation:pulse 1.6s ease-in-out infinite;
}
#btn-pencup,#btn-custom,#btn-archive{width:100%;max-width:420px;margin:11px auto;padding:14px;font-size:10px;line-height:1.4;}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 #0b0f24, 0 0 0 rgba(52,208,88,0);}
  50%{box-shadow:0 5px 0 #0b0f24, 0 0 28px rgba(52,208,88,.55);}}
#btn-continue{max-width:420px; margin:0 auto;}
.foot{text-align:center; font-size:10px; color:#5e6c96; margin-top:10px; letter-spacing:1px;}

/* ===== MODE SELECT ===== */
.modebox{border:3px solid #4a5688; background:linear-gradient(180deg,#1c2348,#141a38); padding:18px 14px; margin:14px 0;
  cursor:pointer; box-shadow:0 5px 0 #0b0f24, 0 8px 18px rgba(0,0,0,.4); border-radius:6px; transition:transform .1s;}
.modebox:hover{transform:translateY(-2px); border-color:var(--accent);}
.modebox:active{transform:translateY(2px);}
.modebox h2{font-size:13px; letter-spacing:1px; margin-bottom:10px;}
.modebox .small{line-height:1.6;}
#mode-hard{border-color:#8a2530;}
#mode-hard:hover{border-color:var(--red); box-shadow:0 5px 0 #0b0f24, 0 0 22px rgba(255,71,87,.35);}

/* ===== TEAM SELECT ===== */
#teamgrid{display:block;margin-top:10px;}
.teamgroup{margin:0 0 15px;}
.teamgroup-title{font-family:'Press Start 2P','Courier New',monospace;font-size:11px;color:var(--accent);padding:8px 10px;margin-bottom:7px;border-bottom:2px solid #35416c;letter-spacing:1px;}
.teamgroup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));grid-auto-rows:1fr;align-items:stretch;gap:8px;}
.teamgroup.special{padding:10px;border:2px solid #9da8b9;border-radius:8px;background:linear-gradient(135deg,rgba(210,220,235,.12),rgba(120,140,175,.08));box-shadow:inset 0 0 18px rgba(225,235,255,.08);}
.teamgroup.special .teamgroup-title{color:#e6eefc;border-color:#b7c2d4;text-shadow:0 0 9px rgba(220,235,255,.8);}
.teamgroup.special .tbtn{border-color:#8998ae;background:linear-gradient(160deg,#26334a,#111a2d);box-shadow:inset 0 0 10px rgba(220,235,255,.08);}
.teamgroup.special .tbtn:not(.locked):hover{border-color:#edf4ff;box-shadow:0 0 16px rgba(220,235,255,.5);}
.tbtn{
  background:var(--panel); border:2px solid #3a4570; color:var(--txt); border-radius:5px;
  padding:9px 6px; cursor:pointer; font-family:inherit; font-weight:bold;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:122px; height:100%; font-size:11px; transition:transform .08s;
}
.tbtn:hover{border-color:var(--accent); background:var(--panel2); transform:translateY(-2px);}
.tbtn canvas{width:48px; height:32px; image-rendering:pixelated; border:2px solid #000; border-radius:2px;}
.teamname{display:flex;align-items:center;justify-content:center;text-align:center;min-height:28px;line-height:1.3;}
.stars{color:var(--gold);font-size:22px;line-height:1.35;letter-spacing:3px;min-height:31px;text-shadow:0 2px 0 #000;}
.stars.platinum{color:#e7eef8;font-size:24px;text-shadow:0 0 5px #fff,0 0 12px #8ebcff,0 2px 0 #000;letter-spacing:3px;}
.teamcups{color:var(--gold);font-size:10px;letter-spacing:1px;display:inline-flex;gap:5px;align-items:center;justify-content:center;}
.teamcups.penalty{color:#7de2ff;}
.tbtn.locked{opacity:.52; filter:grayscale(.55); cursor:not-allowed;}
.lockhint{color:#9aa8cc; font-size:9px; line-height:1.35; min-height:24px;}
.achstats{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:11px;border:2px solid #4a5688;background:#0d1330;border-radius:8px;font-size:10px;line-height:1.6;margin-bottom:12px}.achstats span{padding:5px 7px;background:#171f45;border-radius:6px;white-space:nowrap}
.achlist{display:grid;gap:11px;text-align:left;}
.achgroup{display:grid;gap:10px;margin:8px 0 22px}.achgroup-title{font-family:'Press Start 2P','Courier New',monospace;font-size:11px;color:#ffd700;padding:12px 9px;border-bottom:3px solid #4a5688;background:linear-gradient(90deg,rgba(255,215,0,.14),transparent);letter-spacing:1px;line-height:1.5}.achgroup-progress{float:right;color:#c2cceb;font-size:9px}
.achrow{position:relative;padding:14px 13px 14px 18px;border:3px solid #35416c;border-radius:9px;background:#101633;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.28);}
.achrow::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:#59617c;}
.achrow.locked{opacity:.68;filter:grayscale(.55);}
.achrow.common{border-color:#2b9b58;background:linear-gradient(120deg,#10271b,#13203a);}.achrow.common::before{background:#34d058;}
.achrow.rare{border-color:#328ec7;background:linear-gradient(120deg,#10263a,#171d44);}.achrow.rare::before{background:#4cc9f0;}
.achrow.epic{border-color:#9b55d7;background:linear-gradient(120deg,#2a153d,#171d44);}.achrow.epic::before{background:#c77dff;}
.achrow.legendary{border-color:#d5a800;background:linear-gradient(120deg,#392d08,#4a1b18);box-shadow:0 0 12px rgba(255,215,0,.16);}.achrow.legendary::before{background:#ffd700;}
.achtitle{font-size:13px;margin-bottom:7px;line-height:1.55;}.achrow.common .achtitle{color:#7dffa0}.achrow.rare .achtitle{color:#7de2ff}.achrow.epic .achtitle{color:#dda8ff}.achrow.legendary .achtitle{color:#ffe568}
.achdesc{color:#b8c4e4;font-size:11px;line-height:1.65;}
.rarity{float:right;font-size:8px;padding:3px 6px;border:2px solid currentColor;border-radius:10px;opacity:.95;margin-left:6px;}
/* ===== TROPHY CABINET (achievements) ===== */
.cabinet{border:4px solid #6b4e1e;border-radius:12px;background:linear-gradient(180deg,#241a0f,#140d07);box-shadow:inset 0 0 34px rgba(0,0,0,.65),0 5px 0 #0b0f24;padding:12px 11px 6px;}
.cab-head{display:grid;gap:8px;padding:4px 4px 14px;text-align:center;}
.cab-count{font-family:'Press Start 2P','Courier New',monospace;font-size:12px;color:#ffd700;letter-spacing:1px;text-shadow:2px 2px 0 #000;}
.cab-progress{height:15px;border:2px solid #6b4e1e;border-radius:8px;background:#0c0a06;overflow:hidden;}
.cab-progress span{display:block;height:100%;background:linear-gradient(90deg,#c99700,#ffe568);box-shadow:0 0 8px rgba(255,215,0,.4);}
.shelf{margin:0 0 18px;}
.shelf-label{font-family:'Press Start 2P','Courier New',monospace;font-size:9px;color:#f2dca6;letter-spacing:1px;padding:6px 6px 8px;display:flex;justify-content:space-between;align-items:center;}
.shelf-label small{color:#b79b63;font-size:9px;}
.shelf-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px;padding:12px 8px 14px;border-bottom:8px solid #3a2913;border-radius:0 0 7px 7px;background:linear-gradient(180deg,rgba(255,235,190,.05),rgba(255,235,190,0));box-shadow:0 7px 6px -4px rgba(0,0,0,.6);}
.medal{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;}
.medal .disc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:27px;position:relative;border:3px solid #59617c;background:radial-gradient(circle at 35% 30%,#2a3358,#141a34);box-shadow:0 3px 7px rgba(0,0,0,.55);}
.medal .disc::after{content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:18px;height:14px;background:linear-gradient(180deg,#d33,#8f1616);clip-path:polygon(0 0,100% 0,100% 100%,50% 66%,0 100%);opacity:.92;}
.medal .plate{font-size:10px;line-height:1.35;color:#eef1fb;min-height:24px;}
.medal .plate small{display:block;font-size:8.5px;color:#a7b2d4;font-weight:normal;line-height:1.35;margin-top:2px;}
.medal.common .disc{border-color:#34d058;background:radial-gradient(circle at 35% 30%,#1e8a45,#0d3d21);}
.medal.rare .disc{border-color:#4cc9f0;background:radial-gradient(circle at 35% 30%,#2079ab,#0d2f44);}
.medal.epic .disc{border-color:#c77dff;background:radial-gradient(circle at 35% 30%,#7f42b8,#2a153d);}
.medal.legendary .disc{border-color:#ffd700;background:radial-gradient(circle at 35% 30%,#d4a800,#5a4300);box-shadow:0 0 15px rgba(255,215,0,.55);}
.medal.legendary .disc::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(255,215,0,.45);}
.medal.common .plate b{color:#7dffa0}.medal.rare .plate b{color:#7de2ff}.medal.epic .plate b{color:#dda8ff}.medal.legendary .plate b{color:#ffe568}
.medal.locked{opacity:.5;filter:grayscale(.75);}
.medal.locked .disc{border-color:#4a5470;background:radial-gradient(circle at 35% 30%,#2a3152,#12172c);font-size:22px;}
.medal.locked .disc::after{display:none;}
.medal.locked .plate b{color:#8b96b8;}
@media (max-width:420px){.shelf-row{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;}.medal .disc{width:48px;height:48px;font-size:23px;}.medal .plate{font-size:9px;}}
/* ===== HIGH SCORES (trophy-cabinet style) ===== */
.recgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 4px 4px;}
.reccard{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 10px;background:#101633;border:2px solid #35416c;border-radius:10px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.3);}
.reccard .recdisc{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;border:3px solid #59617c;background:#0d1330;}
.reccard .recval{font-family:'Press Start 2P','Courier New',monospace;font-size:24px;color:#fff;text-shadow:2px 2px 0 #000;line-height:1;}
.reccard .reclabel{font-size:11px;color:#b8c4e4;line-height:1.45;}
.reccard.wide{grid-column:1/-1;}
.reccard.streak .recdisc{border-color:#ff9f1c;}.reccard.streak .recval{color:#ffb84d;}
.reccard.hits .recdisc{border-color:#34d058;}.reccard.hits .recval{color:#7dffa0;}
.reccard.cups .recdisc{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.4);}.reccard.cups .recval{color:#ffe568;}
.reccard.pens .recdisc{border-color:#4cc9f0;}.reccard.pens .recval{color:#7de2ff;}
.reccard.best .recdisc{border-color:#c77dff;}.reccard.best .recval{color:#dda8ff;}
.rewardbox{margin-top:12px;padding:11px;border:2px solid var(--gold);border-radius:8px;text-align:left;display:grid;gap:8px;background:linear-gradient(180deg,rgba(255,215,0,.09),rgba(255,215,0,.02));}
.rewardhead{color:var(--gold);font-size:11px;letter-spacing:1px;text-align:center;font-family:'Press Start 2P','Courier New',monospace;line-height:1.6;padding:2px 0;}
.rewardrow{display:flex;align-items:center;gap:10px;padding:9px 11px;background:#101633;border:2px solid #35416c;border-left-width:6px;border-radius:7px;font-size:14px;line-height:1.4;text-align:left;color:var(--txt);}
.rewardrow .ricon{font-size:20px;line-height:1;}
.rewardrow.common{border-left-color:#34d058}.rewardrow.rare{border-left-color:#4cc9f0}.rewardrow.epic{border-left-color:#c77dff}.rewardrow.legendary{border-left-color:#ffd700}
.rewardrow .rname{flex:1}
.rewardrow .rdesc{display:block;font-size:10.5px;color:#9aa8cc;font-weight:normal;line-height:1.45;margin-top:3px;}
.rewardrow .rlp{color:#3a2a00;background:linear-gradient(180deg,#ffd75e,#c99700);border-radius:12px;padding:5px 10px;white-space:nowrap;font-size:12px;font-weight:bold;}
.rewardmore{font-size:11px;color:#c2cceb;text-align:center;letter-spacing:.5px;}
.rewardcareer{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;}
.rchip{padding:7px 13px;border-radius:15px;font-size:13px;border:1px solid;white-space:nowrap;font-weight:bold;}
.rchip.xp{color:#ffe568;border-color:rgba(255,215,0,.55);background:rgba(255,215,0,.1);}
.rchip.fans{color:#7de2ff;border-color:rgba(76,201,240,.55);background:rgba(76,201,240,.1);}
.bracket{display:grid;gap:6px;margin-top:9px;text-align:left;}
.bracket.compact{max-width:560px;margin:9px auto 0}.bracket.compact .bracketrow{grid-template-columns:122px 1fr auto;font-size:12px}
.bracket.full{max-height:330px;overflow:auto;padding:4px;grid-template-columns:repeat(5,minmax(168px,1fr));align-items:start;scrollbar-width:thin;}
.bracketcol{display:grid;gap:5px;align-content:start}.brackettitle{position:sticky;top:0;z-index:2;background:#161c3f;color:#ffd700;padding:6px 3px;font-size:9px;text-align:center;}
.bracketrow{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;padding:9px 10px;background:#101633;border:2px solid #35416c;border-radius:5px;font-size:12px;line-height:1.45;}
.bracket.full .bracketrow{grid-template-columns:1fr auto;padding:6px;font-size:8px}.bracket.full .bracketrow b{grid-column:1/-1;color:#9aa8cc;font-size:7px}.bracketrow.player{border-color:#4cc9f0;background:#152b48}

  if(['all_green','all_red','penalty_master','penalty_wall','giant_killer','clean_10','academy_5'].includes(id))return 'epic';
  if(['group_escape','knockout_win','comeback','shootout_win','three_reds','serial_winner','hat_trick','goal_fest','red_survivor','goals_50','custom_win'].includes(id))return 'rare';
  return 'common';
}

function resetMatchStats(){matchStats={clicks:0,green:0,miss:0,wasBehind:false,wonShootout:false,penShots:0,penGoals:0,penFaced:0,penSaves:0,openGoals:null};}
function recordMatchAchievements(myG,opG,reds){
  if(!matchStats)resetMatchStats();
  /* goals from open play only — shootout goals don't count as match goals */
  const og=matchStats.openGoals,gm=og?og.my:myG,go=og?og.op:opG,penCup=G.tournamentType==='penalty';
  PROGRESS.matches++;PROGRESS.goals=(PROGRESS.goals||0)+gm;
  if(myG>0)unlockAchievement('first_goal');
  if(myG>opG){PROGRESS.wins++;unlockAchievement('first_win');}
  if(myG<opG){PROGRESS.losses++;unlockAchievement('first_loss');}
  if(myG===opG)PROGRESS.draws=(PROGRESS.draws||0)+1;
  if(G.phase==='ko'&&myG>opG&&!penCup){PROGRESS.knockoutWins=(PROGRESS.knockoutWins||0)+1;unlockAchievement('knockout_win');}
  if(matchStats.clicks>=8&&matchStats.miss===0)unlockAchievement('all_green');
  if(G.tournamentType==='normal'&&G.mode==='classic'&&matchStats.clicks>0&&matchStats.green===0)unlockAchievement('all_red');
  if(myG>opG&&go===0&&!penCup){PROGRESS.cleanSheets=(PROGRESS.cleanSheets||0)+1;unlockAchievement('clean_sheet');}
  if(gm>=3)unlockAchievement('hat_trick');
  if(gm>=5)unlockAchievement('goal_fest');
  if(myG>opG&&matchStats.wasBehind)unlockAchievement('comeback');
  if(myG>opG&&reds>=1)unlockAchievement('red_survivor');
  if(reds>=2)unlockAchievement('three_reds');
  if(PROGRESS.matches>=10)unlockAchievement('veteran');
  if(PROGRESS.wins>=10)unlockAchievement('serial_winner');
  if(PROGRESS.goals>=50)unlockAchievement('goals_50');
  if(PROGRESS.cleanSheets>=10)unlockAchievement('clean_10');
  if(PROGRESS.matches>=100)unlockAchievement('centurion');
  if(myG>opG&&myTeam().s<=6&&G.curOpp&&G.curOpp.s>=9)unlockAchievement('giant_killer');
  if(myG>opG&&G.teamIdx===CUSTOM_INDEX)unlockAchievement('custom_win');
  if(matchStats.penSaves>=3)unlockAchievement('penalty_wall');
  if(matchStats.wonShootout){
    PROGRESS.shootoutWins++;unlockAchievement('shootout_win');
    if(matchStats.penShots>0&&matchStats.penGoals===matchStats.penShots&&matchStats.penSaves>0)unlockAchievement('penalty_master');
  }
  saveProgress();checkTeamUnlocks(true);
}
function progressCustomTeam(myG,opG){
  if(G.teamIdx!==CUSTOM_INDEX)return;
  CUSTOM.matches++;if(myG>opG)CUSTOM.wins++;
  const points=(myG>opG?2:myG===opG?1:0)+(G.phase==='ko'&&myG>opG?1:0);if(points){CUSTOM.trainingPoints+=points;CUSTOM.trainingEarned+=points;NEW_REWARDS.push({type:'training',points});}saveCustomTeam();
}
function grantCustomTraining(points){if(G.teamIdx!==CUSTOM_INDEX||points<=0)return;CUSTOM.trainingPoints+=points;CUSTOM.trainingEarned+=points;saveCustomTeam();NEW_REWARDS.push({type:'training',points});}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(freq,dur,type,vol,delay){
  const a=ac();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain();
    o.type=type||'square';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.08,a.currentTime+(delay||0));
    g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+(delay||0)+dur);
    o.connect(g);g.connect(a.destination);
    o.start(a.currentTime+(delay||0));o.stop(a.currentTime+(delay||0)+dur+0.02);
  }catch(e){}
}
function noise(dur,vol){
  const a=ac();if(!a)return;
  try{
    const buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=a.createBufferSource(),g=a.createGain();g.gain.value=vol||0.1;
    s.buffer=buf;s.connect(g);g.connect(a.destination);s.start();
  }catch(e){}
}

}
function paintCustomPattern(c,p,c1,c2,W,H){c.fillStyle=c1;c.fillRect(0,0,W,H);c.fillStyle=c2;
  if(p==='halves')c.fillRect(W/2,0,W/2,H);
  else if(p==='stripes')for(let x=4;x<W;x+=8)c.fillRect(x,0,4,H);
  else if(p==='diagonal'){c.beginPath();c.moveTo(0,H*.72);c.lineTo(0,H);c.lineTo(W,H*.28);c.lineTo(W,0);c.closePath();c.fill();}

  else if(p==='hoops')for(let y=4;y<H;y+=8)c.fillRect(0,y,W,4);
}

function phaseLabel(){return G.phase==='group'?T().phaseGroup(G.groupLetter,G.matchIdx+1):T().ko[G.koRound];}
function barCfg(kind,ctx=null){
  const d=difficulty(),opS=G.curOpp?G.curOpp.s:5,myS=myTeam()?myTeam().s:5;
  let w=0.32-0.015*opS-0.013*d,tier=null;
  let sp=0.9+0.055*opS+0.06*d;
  /* STAR GAP: underdogs feel the gap, favourites cruise */
  const gap=opS-myS;
  w*=Math.max(.55,Math.min(1.45,1-gap*.05));
  sp*=Math.max(.8,Math.min(1.3,1+gap*.035));
  if(kind==='shot'){w*=0.7;sp*=1.18;}
  if(kind==='save'){
    if(G.pitchMode==='penalty'){
      /* penalty saves are ALWAYS tough: small window, quick needle — the hard half of a shootout */
      w*=.5;sp*=1.22;
    }else{
      const roll=Math.random();tier=roll<.35?'easy':roll<.78?'normal':'hard';
      if(tier==='easy'){w*=1.15;sp*=.92;}
      else if(tier==='normal'){w*=.72;sp*=1.1;}
      else{w*=.43;sp*=1.32;}
    }
  }
  if(kind==='pen'){w*=.9;sp*=1.04;}
  if(G.mode==='hard'){w*=1.15;} // a sliver of mercy — one miss still ends it all
  if(G.teamIdx===CUSTOM_INDEX){if(kind==='pass')w*=Math.max(.72,1+(CUSTOM.passing-5)*.05);if(kind==='shot')w*=Math.max(.72,1+(CUSTOM.attack-5)*.045);if(kind==='save')w*=Math.max(.68,1+(CUSTOM.goalkeeping-5)*.055);}
  /* COMBO: a small width reward, offset by a faster needle — difficulty stays level */
  w*=1+Math.min(0.10,G.combo*0.01);
  sp*=1+Math.min(0.12,G.combo*0.008);
  /* CARDS PENALTY: yellows & reds shrink it */
  w*=Math.pow(0.93,G.mYellows)*Math.pow(0.8,G.mReds+G.carryReds);
  /* FIELD CONTEXT: long passes, tight pressing and the final third are harder */
  if(ctx){
    const dist=ctx.distance||45,pressure=ctx.pressure==null?60:ctx.pressure,zone=ctx.zone||.35,angle=ctx.angle||0;
    const longPenalty=Math.max(0,dist-48)/210;
    const pressPenalty=Math.max(0,44-pressure)/105;
    const zonePenalty=kind==='shot'?Math.max(0,.72-zone)*.18:Math.max(0,zone-.64)*.12;
    const anglePenalty=kind==='shot'?Math.max(0,angle-20)/260:0;
    w*=Math.max(.58,1-longPenalty-pressPenalty-zonePenalty-anglePenalty);
    sp*=1+longPenalty*.32+pressPenalty*.5+zonePenalty*.35;
  }
  return{w,sp:Math.min(sp,2.5),tier};
}
function comboUp(n){G.combo+=n;G.runHits+=1;G.missStreak=0;
  if(G.combo>G.bestCombo){G.bestCombo=G.combo;}
  if(G.runHits>G.bestRun){G.bestRun=G.runHits;}bumpHS();save();}
function comment(t){$('comment').textContent=t;}

async function doStep(label,kind,ctx=null){

function passRoute(spots,dir,count){
  const sorted=[...spots].sort((a,b)=>dir*(a[0]-b[0])),out=[];
  for(let i=0;i<=count;i++)out.push(sorted[Math.round(i*(sorted.length-1)/count)]);
  return out;
}
function nearestSpot(spots,target){return [...spots].sort((a,b)=>Math.hypot(a[0]-target[0],a[1]-target[1])-Math.hypot(b[0]-target[0],b[1]-target[1]))[0];}
function spatialContext(from,to,defenders,attackDir=G.attackDir){
  const nearest=nearestSpot(defenders,to),pressure=Math.hypot(nearest[0]-to[0],nearest[1]-to[1]);
  return{distance:Math.hypot(to[0]-from[0],to[1]-from[1]),pressure,zone:(attackDir===1?to[0]:320-to[0])/320,angle:Math.abs(to[1]-103)};
}
function counterFormationFor(route,step){
  const p=step/(route.length-1),carrier=route[step],dir=-G.attackDir,mine=orientedBase(true),opp=orientedBase(false);
  mine.forEach((s,i)=>{s[0]+=dir*(8+p*(10+i));s[1]+=(carrier[1]-s[1])*.2;});
  opp.forEach((s,i)=>{s[0]+=dir*p*(12+i*1.8);s[1]+=(carrier[1]-s[1])*.15;});
  const ids=[0,2,3,5],ci=ids[Math.min(step,ids.length-1)];opp[ci]=[...carrier];
  const marker=nearestSpot(mine,carrier),mi=mine.indexOf(marker);if(mi>=0)mine[mi]=[carrier[0]-dir*16,carrier[1]+(step%2?7:-7)];

}
function finalThirdFormation(){

async function playMatch(){
  if(G.tournamentType==='penalty'){await playPenaltyMatch();return;}
  matchCancelled=false;
  const t=T();
  const opp=nextOpponent();G.curOpp=opp;
  const me=myTeam();
  let myG=0,opG=0,forcePlayerPossession=false;
  resetMatchStats();G.pitchMode='match';G.attackDir=1;resetFormations();
  G.mYellows=0;G.mReds=0;G.missStreak=0;updCards();
  const updScore=()=>updateScorebar(me,opp,myG,opG);
  updScore();comment(G.carryReds>0?t.suspended:'');$('actionlbl').textContent='';
  show('scr-match');
  ball={x:mySpots()[0][0],y:mySpots()[0][1]};trail=[];
  bigMsg(G.phase==='group'?X().groupLabel(G.groupLetter):T().ko[G.koRound],'#4cc9f0');sWhistle();
  await sleep(800);
  if(matchCancelled)return;

  const MOMENTS_PER_HALF=4;
  for(let half=1;half<=2;half++){
    if(half===2){
      $('minute').textContent="46'";G.attackDir=-1;updScore();
      const newM=orientedBase(true),newO=orientedBase(false);await animateFormations(newM,newO,650);
      if(matchCancelled)return;
      ball={x:mySpots()[0][0],y:mySpots()[0][1]};trail=[];
      bigMsg(X().secondHalf,'#ffd700');comment(X().switchSides);sWhistle();await sleep(1500);
      if(matchCancelled)return;
    }
    for(let a=0;a<MOMENTS_PER_HALF;a++){
      const minute=(half===1?4+a*10+rnd(7):49+a*10+rnd(7));$('minute').textContent=minute+"'";
      const strengthEdge=(me.s-opp.s)*.035,scoreNeed=(opG-myG)*.075,late=minute>72?scoreNeed:scoreNeed*.45,stageCalm=G.phase==='ko'?.02:0;
      const myPossession=Math.max(.27,Math.min(.73,.5+strengthEdge+late-stageCalm));
      let result;const playerTurn=forcePlayerPossession||Math.random()<myPossession;forcePlayerPossession=false;
      if(playerTurn)result=await attackingMove();
      else result={goal:false,conceded:await opponentAttack(false)};
      if(result===null||result.conceded===null)return;
      if(result.goal){myG++;updScore();}
      if(result.conceded){
        opG++;updScore();if(opG>myG)matchStats.wasBehind=true;forcePlayerPossession=true;
        const restartM=orientedBase(true),restartO=orientedBase(false);await animateFormations(restartM,restartO,300);ball={x:160-G.attackDir*7,y:103};trail=[];comment(X().yourRestart);bigMsg(X().yourRestart,'#4cc9f0');await sleep(700);
      }
      await sleep(350);
      if(matchCancelled)return;
    }
  }
  $('minute').textContent="90'";
  if(G.phase!=='group'&&myG===opG){
    bigMsg(t.pens,'#ffd700');comment(X().allSquare);sWhistle();
    await sleep(1100);
    if(matchCancelled)return;
    matchStats.openGoals={my:myG,op:opG};
    const result=await penalties(opp);
    if(result===null)return;
    myG=result.my;opG=result.op;G.attackDir=1;updScore();
  }
  await sleep(500);
  afterMatch(myG,opG);
}

async function attackingMove(){
  const t=T(),plan=actionPlan(),route=plan.route,passCount=route.length-1,first=formationFor(plan,0);
  comment(X().actionStyles[plan.style]);
  await animateFormations(first.mine,first.opp,300);if(matchCancelled)return null;
  ball={x:route[0][0],y:route[0][1]};trail=[];
  for(let p=1;p<route.length;p++){
    const next=formationFor(plan,p),ctx=spatialContext(route[p-1],route[p],next.opp);
    const r=await doStep(X().passProgress(p,passCount),'pass',ctx);
    if(r==='abort')return null;
    if(r==='miss')return await lostBall(false,route[p]);
    await Promise.all([animBall(route[p][0],route[p][1],260,1.5),animateFormations(next.mine,next.opp,260)]);
    if(matchCancelled)return null;
  }
  const goalX=G.attackDir===1?313:7,goalY=88+rnd(31),shotCtx=spatialContext(route[route.length-1],[goalX,goalY],opponentSpots());
  const r=await doStep(t.shoot,'shot',shotCtx);
  if(r==='abort')return null;
  if(r==='miss')return await lostBall(true,[goalX,goalY]);
  const quality=r==='perfect'?.83:.58,teamEdge=(myTeam().s-G.curOpp.s)*.045,pressureBonus=Math.max(-.12,Math.min(.12,(shotCtx.pressure-34)/180)),stagePenalty=G.phase==='ko'?.04+G.koRound*.012:0;
  const scored=r==='perfect'||Math.random()<Math.max(.3,Math.min(.93,quality+teamEdge+pressureBonus-stagePenalty));
  const finish=finalThirdFormation();
  if(!scored){const gkX=G.attackDir===1?306:14,gkY=90+rnd(27);await Promise.all([animBall(gkX,gkY,260,3),animateFormations(finish.mine,finish.opp,260)]);comment(X().keeperSave);bigMsg(t.saved,'#4cc9f0');await sleep(450);let conceded=false;if(Math.random()<.14)conceded=await opponentAttack(true);return{goal:false,conceded};}
  await Promise.all([animBall(goalX,goalY,260,5),animateFormations(finish.mine,finish.opp,260)]);
  comment(pick(t.txt.goal));bigMsg(t.goalMsg,'#2ecc40');sGoal();boom(28,goalX,goalY);shake=6;await sleep(650);
  if(matchCancelled)return null;
  return{goal:true,conceded:false};
}

async function lostBall(wasShot,target){
  const t=T();
  if(wasShot){
    const wideY=target[1]<103?60:146,finish=finalThirdFormation();await Promise.all([animBall(target[0],wideY,240,4),animateFormations(finish.mine,finish.opp,240)]);
  }else{

  }
  if(matchCancelled)return null;

  if(matchCancelled)return null;
  const turnoverZone=(G.attackDir===1?target[0]:320-target[0])/320;
  const counterRisk=Math.max(.1,Math.min(.5,.16+turnoverZone*.18+(G.curOpp.s-myTeam().s)*.03+(G.phase==='ko'?G.koRound*.018:0)));
  let conceded=false;if(Math.random()<counterRisk){conceded=await opponentAttack(true);if(conceded===null)return null;}
  return{goal:false,conceded};
}

async function opponentAttack(isCounter=false){
  const t=T();
  comment(isCounter?t.counterCom:X().opBuild);
  bigMsg(isCounter?t.counter:(G.phase==='ko'?X().stagePressure:X().opBuild),isCounter?'#ff9f1c':'#ffd700');
  const dir=-G.attackDir,passCount=isCounter?3:4+rnd(2),route=passRoute(opponentSpots(),dir,passCount);
  let form=counterFormationFor(route,0);await Promise.all([animBall(route[0][0],route[0][1],180,1),animateFormations(form.mine,form.opp,180)]);
  for(let i=1;i<route.length;i++){form=counterFormationFor(route,i);await Promise.all([animBall(route[i][0],route[i][1],210,1.5),animateFormations(form.mine,form.opp,210)]);if(matchCancelled)return null;}
  const customDefense=G.teamIdx===CUSTOM_INDEX?(CUSTOM.defense-5)*.025:0,stopChance=Math.max(.08,Math.min(.78,.34+(myTeam().s-G.curOpp.s)*.055+customDefense-(G.mReds+G.carryReds)*.07-(isCounter?.1:0)));
  if(Math.random()<stopChance){const defender=nearestSpot(mySpots(),route[route.length-1]);await animBall(defender[0],defender[1],180,1);comment(X().attackStopped);bigMsg('✓','#2ecc40');await sleep(350);return false;}
  const goalX=dir===1?313:7,goalY=90+rnd(27),gkX=dir===1?306:14,ctx=spatialContext(route[route.length-1],[goalX,goalY],mySpots(),dir);
  const r=await doStep(t.saveIt,'save',ctx);
  if(r==='abort')return null;
  if(r==='miss'){
    if(G.mode==='hard'){await hardcoreDeath(t.failedSave);return null;}
    const threat=Math.max(.42,Math.min(.92,.67+(G.curOpp.s-myTeam().s)*.045+(G.phase==='ko'?G.koRound*.015:0)));
    if(Math.random()>threat){await animBall(goalX,goalY<103?58:148,190,5);comment(pick(t.txt.missShot));bigMsg(t.missed,'#ffd700');await sleep(450);await maybeCard();return false;}
    await animBall(goalX,goalY,190,5);
    comment(pick(t.txt.concede));bigMsg(t.theyScore,'#ff4757');sConcede();shake=7;
    await sleep(650);
    await maybeCard();
    if(matchCancelled)return null;
    return true;
  }
  comment(pick(t.txt.save));bigMsg(t.saved,'#4cc9f0');boom(14,20,100);
  await animBall(gkX,goalY,190,3);
  await sleep(400);
  if(matchCancelled)return null;
  return false;
}

async function counterAttack(){return opponentAttack(true);}

async function penalties(opp){
  const t=T(),x=X(),me=myTeam();
  let my=0,op=0;
  G.pitchMode='penalty';G.attackDir=1;penaltyScorebar(me,opp,my,op);
  for(let r=1;r<=20;r++){
    comment(t.penComment(Math.min(r,5),r>5,my,op));
    penaltyActor='me';penKeeperY=90+rnd(27);ball={x:258,y:103};trail=[];matchStats.penShots++;
    const res=await doStep(x.penShoot,'pen');
    if(res==='abort'||matchCancelled)return null;
    if(res!=='miss'){my++;matchStats.penGoals++;await animBall(313,90+rnd(27),220,5);bigMsg(t.goalMsg,'#2ecc40');sGoal();}
    else{
      if(G.mode==='hard'){await hardcoreDeath(t.missedPen);return null;}
      await animBall(316,58+rnd(10),220,5);bigMsg(t.missed,'#ff4757');
    }
    penaltyScorebar(me,opp,my,op);
    await sleep(650);
    if(matchCancelled)return null;
    penaltyActor='op';penKeeperY=103;ball={x:258,y:103};trail=[];matchStats.penFaced++;
    const save=await doStep(x.penSave,'save');
    if(save==='abort'||matchCancelled)return null;
    if(save==='miss'){
      if(G.mode==='hard'){await hardcoreDeath(t.failedSave);return null;}
      op++;await animBall(313,90+rnd(27),220,5);bigMsg(t.theyScore,'#ff4757');sConcede();
    }
    else{penKeeperY=88+rnd(31);matchStats.penSaves++;await animBall(304,penKeeperY,220,3);bigMsg(t.savedPen,'#4cc9f0');boom(10,304,penKeeperY);}
    penaltyScorebar(me,opp,my,op);
    await sleep(650);
    if(matchCancelled)return null;
    if(r>=5&&my!==op){matchStats.wonShootout=my>op;return{win:my>op,my,op};}
    if(r<5){
      const left=5-r;
      if(my-op>left){matchStats.wonShootout=true;return{win:true,my,op};}
      if(op-my>left){return{win:false,my,op};}
    }
  }
  matchStats.wonShootout=my>op;return{win:my>op,my,op};
}

async function playPenaltyMatch(){
  matchCancelled=false;
  const opp=nextOpponent();G.curOpp=opp;G.mYellows=0;G.mReds=0;G.carryReds=0;G.missStreak=0;
  resetMatchStats();matchStats.openGoals={my:0,op:0};G.pitchMode='penalty';G.attackDir=1;updCards();
  penaltyScorebar(myTeam(),opp,0,0);$('minute').textContent='⚽';$('actionlbl').textContent='';comment(X().penCupDesc);
  show('scr-match');ball={x:258,y:103};trail=[];bigMsg(X().penaltyRoundShort(T().ko[G.koRound]),'#ffd700');sWhistle();await sleep(1100);
  if(matchCancelled)return;
  const result=await penalties(opp);if(result===null)return;
  bigMsg(result.win?X().penaltyWon:X().penaltyLost,result.win?'#2ecc40':'#ff4757');await sleep(700);
  if(matchCancelled)return;
  afterMatch(result.my,result.op);
}

/* ============ HARDCORE: death ============ */
async function hardcoreDeath(why){
  const t=T();
  sDoom();shake=10;
  bigMsg('💀','#ff4757');
  comment('...');
  await sleep(1200);
  if(matchCancelled)return;
  bumpHS();
  const stage=G.phase==='group'?t.groupsMatch(G.matchIdx+1):t.ko[G.koRound];
  const stats=t.deathStats(G.year,stage,G.runHits,G.bestRun,G.bestCombo,G.trophies);
  G.year=2026;G.wcIndex=0;G.trophies=0;G.runHits=0;G.combo=0;G.carryReds=0;G.finished=true;updBands();save();
  msgScreen('💀',t.careerOver,t.cause(why),
    stats+'<br><br>'+t.deathBody,
    [[t.oneMore,()=>{newTournament();},'btn danger'],
     [t.changeMode,()=>{buildTeamGrid();show('scr-team');},'']]);
}

/* ============ AFTER THE MATCH ============ */
function afterMatch(myG,opG){
  const t=T();
  const redsThisMatch=G.mReds;
  recordMatchAchievements(myG,opG,redsThisMatch);
  progressCustomTeam(myG,opG);
  /* cards: yellows expire, reds carry exactly 1 match */
  G.carryReds=G.mReds;G.mReds=0;G.mYellows=0;G.missStreak=0;
  /* combo (green streak) carries on between matches — only a missed tap ends it */
  bumpHS();
  if(G.phase==='group'){
    const pr=PAIRS[G.matchIdx];
    applyResult(G.group[pr[0][0]],myG,opG);
    applyResult(G.group[pr[0][1]],opG,myG);
    const a=G.group[pr[1][0]],b=G.group[pr[1][1]];
    const ga=simScore(TEAMS[a.i].s,TEAMS[b.i].s),gb=simScore(TEAMS[b.i].s,TEAMS[a.i].s);
    applyResult(a,ga,gb);applyResult(b,gb,ga);
    G.matchIdx++;
    if(G.matchIdx<3){
      msgScreen(myG>opG?'⚽':'😬',resTitle(myG,opG),`${tn(myTeam())} ${myG}:${opG} ${tn(G.curOpp)}`,
        `${t.elsewhere} ${tn(TEAMS[a.i])} ${ga}:${gb} ${tn(TEAMS[b.i])}`,
        [[t.contBtn,()=>renderTour()]]);
    }else{
      const sorted=[...G.group].sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
      const place=sorted.findIndex(r=>r.i===G.teamIdx)+1;
      const lucky=place===3&&(G.tournamentType==='archive'&&G.archiveYear<=1994?Math.random()<.67:G.tournamentType==='normal'&&Math.random()<.6);
      if(place<=2||lucky){
        PROGRESS.groups++;saveProgress();unlockAchievement('group_escape');
        grantCustomTraining(2);
        G.phase='ko';initKnockoutBracket();
        msgScreen('🎉',t.groupCleared,t.finished(ord(place),G.groupLetter),
          lucky?t.lucky:t.koAwait,
          [[t.onward,()=>renderTour()]]);
      }else{
        elimination(t.tooEarly(ord(place),G.groupLetter));
      }
    }
  }else{
    recordBracketPlayerResult(myG,opG);
    G.koHistory.push({round:G.koRound,opp:TEAMS.indexOf(G.curOpp),myG,opG,won:myG>opG});
    if(myG>opG){
      if(G.koRound===T().ko.length-1){championship();}
      else{
        buildNextBracketRound();
        msgScreen('🎉',resTitle(myG,opG),`${tn(myTeam())} ${myG}:${opG} ${tn(G.curOpp)}`,
          t.upNext(t.ko[G.koRound])+knockoutBracketHtml(true),[[t.onward,()=>renderTour()]]);
      }
    }else{
      elimination(t.beaten(myG,opG,tn(G.curOpp),t.ko[G.koRound]));
    }
  }
  save();
}
function resTitle(a,b){const t=T();return a>b?t.victory:(a===b?t.draw:t.defeat);}

/* ============ STORY SCREENS ============ */
function msgScreen(icon,title,sub,body,btns){
  $('m-icon').textContent=icon;$('m-title').textContent=title;
  $('m-sub').textContent=sub;$('m-body').innerHTML=body+rewardHtml();
  const wrap=$('m-btns');wrap.innerHTML='';
  btns.forEach(([label,fn,cls])=>{
    const b=document.createElement('button');b.className='btn '+(cls||'big');b.textContent=label;b.onclick=fn;wrap.appendChild(b);
  });
  show('scr-msg');
}
function elimination(why){
  const t=T(),x=X();
  G.finished=true;save();
  if(G.teamIdx===CUSTOM_INDEX&&G.tournamentType==='normal'){
    /* custom-team loop: defeat → hand out training points → fresh cycle from 2026 */
    const lostYear=G.year;
    G.year=2026;G.wcIndex=0;G.trophies=0;updBands();save();
    msgScreen('😢',t.knocked,t.wcOver(lostYear),
      why+'<br><br>'+x.cycleReset+(G.phase==='ko'?knockoutBracketHtml(false):''),
      [[x.devGo,()=>{openCustomDevelopment();},'btn gold'],
       [t.mainMenu,()=>{leaveToMenu();},'']]);
    return;
  }
  msgScreen('😢',t.knocked,t.wcOver(G.year),
    why+'<br><br>'+x.sameYear+(G.phase==='ko'?knockoutBracketHtml(false):''),
    [[x.retryYear(G.year),()=>{newTournament();}],
     [t.changeTeam,()=>{buildTeamGrid();show('scr-team');},'']]);
}
function playFinaleCelebration(){
  const c=$('celebration');c.querySelector('.finale-cup').textContent=G.tournamentType==='penalty'?'🥅🏅':'🏆';$('finale-title').textContent=X().finaleTitle+'\n'+tn(myTeam()).toUpperCase();
  c.classList.remove('on');void c.offsetWidth;c.classList.add('on');
  sGoal();setTimeout(()=>{tone(784,.18,'square',.09);tone(1046,.4,'square',.08,.18);},350);
  setTimeout(()=>c.classList.remove('on'),3000);
}
function championship(){
  const t=T();
  const penaltyTitle=G.tournamentType==='penalty';
  G.finished=true;
  G.trophies++;
  if(penaltyTitle)HS.penaltyCupsTotal=(HS.penaltyCupsTotal||0)+1;else HS.cupsTotal++;
  if(G.teamIdx===CUSTOM_INDEX&&!penaltyTitle){CUSTOM.cups++;grantCustomTraining(6);}
  if(penaltyTitle){if(G.teamIdx===CUSTOM_INDEX){CUSTOM.penaltyCups=(CUSTOM.penaltyCups||0)+1;saveCustomTeam();}else TEAM_PENALTY_CUPS[G.teamIdx]=teamPenaltyCups(G.teamIdx)+1;savePenaltyTeamCups();unlockAchievement('penalty_champion');}
  else{if(G.teamIdx!==CUSTOM_INDEX)TEAM_CUPS[G.teamIdx]=teamCups(G.teamIdx)+1;PROGRESS.cups++;unlockAchievement('first_cup');if(myTeam().n.startsWith('Poland'))unlockAchievement('patriot');if(G.teamIdx===CUSTOM_INDEX)unlockAchievement('custom_champion');if(PROGRESS.cups>=3||G.trophies>=3)unlockAchievement('dynasty');if(PROGRESS.cups>=5)unlockAchievement('cups_5');}
  saveProgress();checkTeamUnlocks(true);
  saveTeamCups();bumpHS();saveHS();updBands();save();
  boom(120);playFinaleCelebration();
  const extra=G.mode==='hard'
    ?t.hardWin(G.runHits)
    :(G.trophies===1?t.legendUnlocked:t.star(G.trophies));
  const champButtons=G.tournamentType==='archive'?[[X().retryYear(G.archiveYear),()=>newTournament(),'btn gold'],[t.changeTeam,()=>{buildTeamGrid();show('scr-team');},'']]
    :G.teamIdx===CUSTOM_INDEX?[[t.defend(G.year+4),()=>{nextWC();newTournament();},'btn gold'],[`📈 ${X().devTitle}`,()=>{nextWC();openCustomDevelopment();},''],[t.changeTeam,()=>{buildTeamGrid();show('scr-team');},'']]
    :[[t.defend(G.year+4),()=>{nextWC();newTournament();},'btn gold'],[t.changeTeam,()=>{buildTeamGrid();show('scr-team');},'']];
  const celebrationCopy=G.tournamentType==='archive'?X().archiveCelebrate:t.celebrate(extra);
  msgScreen(penaltyTitle?'🥅':'🏆',t.champs(G.year),t.onTop(tn(myTeam())),
    `<div style="font-size:16px;color:#ffd700;line-height:1.7">🎆 ${X().finaleTitle} 🎆</div><br>${celebrationCopy}${knockoutBracketHtml(false)}`,
    champButtons);
}
function nextWC(){G.year+=4;G.wcIndex++;G.mYellows=0;G.mReds=0;G.carryReds=0;G.missStreak=0;save();}

/* ============ BOOT ============ */

loadHS();
loadProgress();loadAchievements();loadUnlocked();
const hadTeamCups=loadTeamCups();
loadPenaltyTeamCups();
(function migrate(){const s=loadLegacyRun();if(s){const legacyCups=s.tournamentType==='penalty'?0:(s.trophies||0);if((s.bestCombo||0)>HS.bestCombo)HS.bestCombo=s.bestCombo;
  if((s.bestRun||0)>HS.bestRun)HS.bestRun=s.bestRun;
  if(!hadTeamCups&&s.teamIdx>=0&&legacyCups>0){TEAM_CUPS[s.teamIdx]=legacyCups;saveTeamCups();}
  PROGRESS.cups=Math.max(PROGRESS.cups||0,HS.cupsTotal||0,legacyCups);saveProgress();saveHS();
  if(!Object.keys(MODE_SAVES).length&&s.teamIdx>=0&&TEAMS[s.teamIdx]){if(s.teamIdx===CUSTOM_INDEX)selectCustomSlot(0,false);Object.assign(G,{year:s.year||2026,wcIndex:s.wcIndex||0,trophies:s.trophies||0,teamIdx:s.teamIdx,mode:s.mode||'classic',tournamentType:s.tournamentType||'normal',archiveYear:s.archiveYear||null,bestCombo:s.bestCombo||0,bestRun:s.bestRun||0,runHits:s.runHits||0,carryReds:s.carryReds||0});newTournament();show('scr-title');}
}})();
checkTeamUnlocks(false);
/* English is the global default; Polish users (browser locale pl) get Polish automatically.
   Manual PL/EN buttons override and persist the choice. */
function detectLang(){return 'pl';}
G.lang=loadLang()||detectLang();
applyLang();
/* SAVE ON EXIT/BACKGROUND: mobile browsers kill backgrounded PWAs without a clean unload —
   flush everything the moment the page is hidden so no progress is ever lost. */
function flushAllSaves(){try{if(G.teamIdx>=0)save();if(G.teamIdx===CUSTOM_INDEX||$('scr-custom').classList.contains('on'))saveCustomTeam();}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushAllSaves();});
window.addEventListener('pagehide',flushAllSaves);
window.addEventListener('beforeunload',flushAllSaves);
</script>
